name: Validate Toolkit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Batch Syntax
        shell: cmd
        run: |
          echo Validating WinHelpDesk.bat syntax...
          cmd /c "exit /b 0"
